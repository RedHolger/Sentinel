[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adi-runtime"
version = "0.1.0"
description = "Execution runtime, model/signal pipelines, quantization benchmarks, and target deployment harnesses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "adi-common>=0.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]
test = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adi_runtime"]
